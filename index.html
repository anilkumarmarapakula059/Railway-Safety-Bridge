  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;
    const API_KEY = "rg_874fe1703f654373bd3fdef5840ad1ee";

    // --- Sound Synthesizer (Web Audio API) ---
    class RailwaySoundEngine {
      constructor() {
        this.ctx = null;
        this.isMuted = false;
      }
      initCtx() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playSiren() {
        if (this.isMuted) return;
        try {
          this.initCtx();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.linearRampToValueAtTime(750, now + 0.35);
          osc.frequency.linearRampToValueAtTime(440, now + 0.7);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.75);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.75);
        } catch (e) {}
      }
      playEmergencyBuzzer() {
        if (this.isMuted) return;
        try {
          this.initCtx();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          for (let i = 0; i < 3; i++) {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(950, now + i * 0.15);
            gain.gain.setValueAtTime(0.18, now + i * 0.15);
            gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.15 + 0.1);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + i * 0.15);
            osc.stop(now + i * 0.15 + 0.1);
          }
        } catch (e) {}
      }
    }
    const soundEngine = new RailwaySoundEngine();

    // --- Mock Data ---
    const INITIAL_TRAINS = [

      },

    const INITIAL_LOGS = [
      { id: 'EVT-9021', time: '18:12:15', type: 'CLOSURE_COMMAND_SENT', sev: 'CRITICAL', train: '12711 Pinakini', dist: '4.2 km', state: 'CLOSING', res: 'ACK_SUCCESS', details: 'Auto-closure dispatched to ESP32: Pinakini Express within 5.0 km threshold.' },
      { id: 'EVT-9020', time: '18:12:12', type: 'ZONE_ENTERED_5KM', sev: 'WARNING', train: '12711 Pinakini', dist: '4.9 km', state: 'SAFE_OPEN', res: 'TRIGGERED', details: 'Train breached 5.0 km proximity boundary. High-priority audio siren active.' },
      { id: 'EVT-9019', time: '18:10:45', type: 'TRAIN_DETECTED', sev: 'INFO', train: '12711 Pinakini', dist: '8.5 km', state: 'SAFE_OPEN', res: 'TRACKING', details: 'Train acquired on Down line approach vector from Singarayakonda.' },
      { id: 'EVT-9018', time: '18:05:00', type: 'BRIDGE_OPENED', sev: 'INFO', train: '—', dist: '0 km', state: 'SAFE_OPEN', res: 'SUCCESS', details: 'Footbridge extended across Platform 1 and 2. Passenger green crossing signals active.' }
    ];

    // --- Main Root Component ---
    function App() {
      const [role, setRole] = useState('PASSENGER'); // PASSENGER, OPERATOR, ADMINISTRATOR
      const [activeTab, setActiveTab] = useState('dashboard'); // dashboard, search, details, control, logs, health, simulation
      const [currentTime, setCurrentTime] = useState(new Date().toLocaleTimeString());
      const [isMuted, setIsMuted] = useState(false);
      const [isDisclaimerOpen, setIsDisclaimerOpen] = useState(false);
      const [freshness, setFreshness] = useState('LIVE');

      // Bridge state
      const [bridgeState, setBridgeState] = useState('CLOSING'); // SAFE_OPEN, CLOSING, CLOSED, TRAIN_PASSING, OPENING, EMERGENCY_STOP, FAULT
      const [positionPct, setPositionPct] = useState(35);
      const [motorStatus, setMotorStatus] = useState('RETRACTING');
      const [crossingActive, setCrossingActive] = useState(false);
      const [esp32Status, setEsp32Status] = useState('ONLINE');

      // Trains & Distance Simulation
      const [trainDistance, setTrainDistance] = useState(4.2);
      const [isSimPlaying, setIsSimPlaying] = useState(false);
      const [selectedTrain, setSelectedTrain] = useState(INITIAL_TRAINS[0]);
      const [searchQuery, setSearchQuery] = useState('');
      const [logs, setLogs] = useState(INITIAL_LOGS);

      // Confirmation Modal State
      const [confirmModal, setConfirmModal] = useState({ isOpen: false, cmd: null, text: '' });

      // Clock
      useEffect(() => {
        const timer = setInterval(() => setCurrentTime(new Date().toLocaleTimeString()), 1000);
        return () => clearInterval(timer);
      }, []);

      // Smooth position motion loop
      useEffect(() => {
        const interval = setInterval(() => {
          if (bridgeState === 'CLOSING' && positionPct > 0) {
            setPositionPct(prev => {
              const next = Math.max(0, prev - 15);
              if (next === 0) {
                setBridgeState('CLOSED');
                setMotorStatus('IDLE');
              }
              return next;
            });
          } else if (bridgeState === 'OPENING' && positionPct < 100) {
            setPositionPct(prev => {
              const next = Math.min(100, prev + 15);
              if (next === 100) {
                setBridgeState('SAFE_OPEN');
                setMotorStatus('IDLE');
                setCrossingActive(true);
              }
              return next;
            });
          }
        }, 400);
        return () => clearInterval(interval);
      }, [bridgeState, positionPct]);

      // Evaluation of proximity rules
      const evaluateDistance = useCallback((dist) => {
        const threshold = 5.0; // Express threshold
        if (dist <= threshold && dist > 0) {
          if (bridgeState === 'SAFE_OPEN' || bridgeState === 'OPENING') {
            soundEngine.playSiren();
            setBridgeState('CLOSING');
            setMotorStatus('RETRACTING');
            setCrossingActive(false);
            setLogs(prev => [
              {
                id: `EVT-${Math.floor(1000 + Math.random() * 9000)}`,
                time: new Date().toLocaleTimeString(),
                type: 'WARNING_GENERATED',
                sev: 'CRITICAL',
                train: '12711 Pinakini',
                dist: `${dist.toFixed(1)} km`,
                state: 'CLOSING',
                res: 'ACK_SUCCESS',
                details: `Proximity breach: 12711 Pinakini Express detected at ${dist.toFixed(1)} km. Automatic bridge closure initiated.`
              },
              ...prev
            ]);
          }
        } else if (dist <= 0 && dist > -0.8) {
          setBridgeState('TRAIN_PASSING');
          setPositionPct(0);
          setCrossingActive(false);
        } else if (dist <= -0.8) {
          if (bridgeState === 'TRAIN_PASSING' || bridgeState === 'CLOSED') {
            setBridgeState('OPENING');
            setMotorStatus('EXTENDING');
            setLogs(prev => [
              {
                id: `EVT-${Math.floor(1000 + Math.random() * 9000)}`,
                time: new Date().toLocaleTimeString(),
                type: 'REOPENING_AUTHORIZED',
                sev: 'INFO',
                train: '12711 Pinakini',
                dist: `${dist.toFixed(1)} km`,
                state: 'OPENING',
                res: 'AUTHORIZED',
                details: 'Train has cleared the station safe boundary (>0.8km past OGL). Safety engine authorized reopening.'
              },
              ...prev
            ]);
          }
        }
      }, [bridgeState]);

      // Simulation continuous play
      useEffect(() => {
        if (!isSimPlaying) return;
        const t = setInterval(() => {
          setTrainDistance(prev => {
            const next = Math.round((prev - 0.2) * 10) / 10;
            if (next < -1.5) {
              evaluateDistance(10.0);
              return 10.0;
            }
            evaluateDistance(next);
            return next;
          });
        }, 700);
        return () => clearInterval(t);
      }, [isSimPlaying, evaluateDistance]);

      // Handle Map Initialization
      const mapContainerRef = useRef(null);
      const mapInstance = useRef(null);
      const trainMarker = useRef(null);

      useEffect(() => {
        if (activeTab !== 'dashboard') return;
        if (!window.L || !mapContainerRef.current) return;

        if (!mapInstance.current) {
          const map = window.L.map(mapContainerRef.current).setView([15.5034, 80.0505], 12);
          window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors | SCR'
          }).addTo(map);

          // Bridge Station Marker
          window.L.marker([15.5034, 80.0505]).addTo(map).bindPopup('<b>Ongole Station (OGL)</b><br>Retractable Footbridge (Platform 1 to 2)');

          // 2km Local Zone (Amber)
          window.L.circle([15.5034, 80.0505], {
            color: '#f59e0b',
            fillColor: '#f59e0b',
            fillOpacity: 0.12,
            weight: 2,
            dashArray: '6, 6',
            radius: 2000
          }).addTo(map);

          // 5km Express Zone (Red)
          window.L.circle([15.5034, 80.0505], {
            color: '#ef4444',
            fillColor: '#ef4444',
            fillOpacity: 0.08,
            weight: 2,
            dashArray: '8, 8',
            radius: 5000
          }).addTo(map);

          // Train Marker
          trainMarker.current = window.L.marker([15.466, 80.046]).addTo(map).bindPopup('<b>12711 Pinakini Express</b><br>Distance: 4.2 km');
          mapInstance.current = map;
        }

        // Update train marker pos
        if (trainMarker.current) {
          const newLat = 15.5034 - (trainDistance / 111.0);
          const newLng = 80.0505 - (trainDistance / 111.0) * 0.15;
          trainMarker.current.setLatLng([newLat, newLng]);
          trainMarker.current.setPopupContent(`<b>12711 Pinakini Express</b><br>Distance: <b>${trainDistance.toFixed(1)} km</b><br>Speed: 88 km/h`);
        }
      }, [activeTab, trainDistance]);

      // Execute Staff Command
      const executeManualCmd = (cmd) => {
        setConfirmModal({ isOpen: false, cmd: null, text: '' });
        if (cmd === 'EMERGENCY_STOP') {
          soundEngine.playEmergencyBuzzer();
          setBridgeState('EMERGENCY_STOP');
          setMotorStatus('BRAKED');
          setCrossingActive(false);
          setLogs(prev => [
            { id: `EVT-${Math.floor(1000 + Math.random() * 9000)}`, time: new Date().toLocaleTimeString(), type: 'EMERGENCY_STOP', sev: 'CRITICAL', train: '—', dist: `${trainDistance.toFixed(1)} km`, state: 'EMERGENCY_STOP', res: 'SUCCESS', details: 'EMERGENCY STOP manually triggered by Railway Operator. Solenoid brake engaged.' },
            ...prev
          ]);
          return;
        }

        if (cmd === 'CLOSE') {
          soundEngine.playSiren();
          setBridgeState('CLOSING');
          setMotorStatus('RETRACTING');
          setCrossingActive(false);
          setLogs(prev => [
            { id: `EVT-${Math.floor(1000 + Math.random() * 9000)}`, time: new Date().toLocaleTimeString(), type: 'CLOSING_STARTED', sev: 'WARNING', train: '—', dist: `${trainDistance.toFixed(1)} km`, state: 'CLOSING', res: 'SUCCESS', details: 'Manual retraction ordered by Operator.' },
            ...prev
          ]);
        } else if (cmd === 'OPEN') {
          if (trainDistance <= 5.0 && trainDistance >= -0.5) {
            alert(`SAFETY INTERLOCK BLOCKED: Train 12711 is at ${trainDistance.toFixed(1)} km! Extension forbidden while train is within 5.0 km danger threshold.`);
            return;
          }
          setBridgeState('OPENING');
          setMotorStatus('EXTENDING');
          setLogs(prev => [
            { id: `EVT-${Math.floor(1000 + Math.random() * 9000)}`, time: new Date().toLocaleTimeString(), type: 'OPENING_STARTED', sev: 'INFO', train: '—', dist: `${trainDistance.toFixed(1)} km`, state: 'OPENING', res: 'SUCCESS', details: 'Manual extension ordered by Operator.' },
            ...prev
          ]);
        } else if (cmd === 'STOP') {
          setMotorStatus('IDLE');
        } else if (cmd === 'RESET_FAULT') {
          setBridgeState(positionPct >= 95 ? 'SAFE_OPEN' : 'CLOSED');
          setMotorStatus('IDLE');
        }
      };

      const isDanger = trainDistance <= 5.0 && trainDistance > 0;

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col font-sans pb-16 md:pb-6">
          {/* HEADER */}
          <header className="bg-slate-900 border-b border-slate-800 text-slate-100 sticky top-0 z-40 shadow-xl">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex flex-col md:flex-row md:items-center md:justify-between gap-3">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-lg bg-blue-600 flex items-center justify-center text-white shadow-lg shadow-blue-500/20 font-black text-xl">
                  🚆
                </div>
                <div>
                  <h1 className="text-xl font-bold tracking-tight text-white flex items-center gap-2">
                    RAILSAFE <span className="text-xs font-medium px-2 py-0.5 rounded bg-blue-900/60 text-blue-300 border border-blue-700">IoT-AUTOBRIDGE</span>
                  </h1>
                  <p className="text-xs text-slate-400 font-medium">
                    Automatic Footbridge Control System • <span className="text-amber-400 font-semibold">Ongole Railway Station (OGL)</span>

              {/* Status Indicators */}

                }`}>
                  📡 ESP32: {esp32Status}
                </div>
              </div>

              {/* Actions & Role Switcher */}
              <div className="flex items-center gap-2.5">

                  onClick={() => {

                  <select
                    value={role}
                    onChange={(e) => setRole(e.target.value)}

                    <option value="PASSENGER" className="bg-slate-900">Passenger (Read Only)</option>
                    <option value="OPERATOR" className="bg-slate-900">Railway Operator</option>
                    <option value="ADMINISTRATOR" className="bg-slate-900">Administrator</option>
                  </select>
                </div>

                <button
                  onClick={() => setIsDisclaimerOpen(true)}
                  className="px-2.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition"
                >
                  ⚠️ Prototype Notice
                </button>

            </div>
          </header>

          {/* NAVIGATION */}
          <nav className="bg-slate-900/90 backdrop-blur border-b border-slate-800">

                    <span>{tab.label}</span>
                    {tab.badge && (
                      <span className="text-[10px] px-1.5 py-0.5 rounded font-bold uppercase bg-slate-800 text-slate-300 border border-slate-700">

              </div>
            </div>

          {/* MAIN VIEW CONTAINER */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

            {/* TAB: DASHBOARD */}
            {activeTab === 'dashboard' && (
              <>
                {/* Safety Alert Banner */}
                {isDanger ? (
                  <div className="rounded-xl border-2 border-red-500 bg-gradient-to-r from-red-950 via-amber-950 to-slate-900 p-5 shadow-2xl animate-pulse">
                    <div className="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
                      <div className="flex items-center gap-3.5">
                        <div className="p-3 rounded-xl bg-red-600 text-white text-2xl font-bold">
                          🚨
                        </div>
                        <div>
                          <span className="px-2 py-0.5 rounded text-[11px] font-black uppercase bg-red-600 text-white">
                            HIGH PRIORITY SAFETY INTERLOCK
                          </span>
                          <h2 className="text-xl font-extrabold text-white mt-1">
                            ⚠️ TRAIN APPROACHING SAFETY THRESHOLD
                          </h2>
                          <p className="text-xs sm:text-sm text-red-200">
                            12711 Pinakini Express detected at {trainDistance.toFixed(1)} km. Bridge closure initiated automatically!
                          </p>
                        </div>
                      </div>

                      <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5 bg-slate-900/80 p-2.5 rounded-lg border border-red-900 text-center text-xs">
                        <div>
                          <span className="text-[10px] uppercase text-slate-400 block font-bold">Train</span>
                          <span className="font-bold text-amber-300">12711 Pinakini</span>
                        </div>

            {activeTab === 'control' && (
              role === 'PASSENGER' ? (
                <div className="bg-slate-900 border border-slate-800 rounded-xl p-8 text-center max-w-xl mx-auto my-12 shadow-xl">
                  <div className="w-16 h-16 rounded-full bg-amber-950 border border-amber-700 text-amber-400 flex items-center justify-center mx-auto mb-4 text-2xl">
                    🔒
                  </div>
                  <h2 className="text-xl font-bold text-slate-100">Restricted Railway Staff Console</h2>
                  <p className="text-xs text-slate-400 mt-2">
                    Direct bridge control is restricted to Station Masters & authorized Railway Operators.
                  </p>
                  <button
                    onClick={() => setRole('OPERATOR')}
                    className="mt-6 px-5 py-2.5 rounded-lg text-xs font-bold bg-blue-600 hover:bg-blue-500 text-white shadow"
                  >
                    Switch to Railway Operator (Demo Auth)
                  </button>
                </div>
              ) : (
                <div className="space-y-6">
                  <div className="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-lg flex justify-between items-center">
                    <div>
                      <h2 className="text-lg font-bold text-slate-100">Authorized Bridge Actuation Console</h2>
                      <p className="text-xs text-slate-400">Authenticated Role: <strong className="text-amber-400">{role}</strong></p>
                    </div>
                    <span className="px-3 py-1 rounded-full text-xs font-bold bg-emerald-950 text-emerald-300 border border-emerald-800">
                      SAFETY INTERLOCK ARMED
                    </span>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <button
                      onClick={() => setConfirmModal({ isOpen: true, cmd: 'OPEN', text: 'Are you sure you want to manually extend the footbridge across to Platform 2?' })}
                      className="p-5 rounded-xl border border-emerald-600 bg-emerald-950/40 hover:bg-emerald-900/60 text-left transition"
                    >
                      <h4 className="text-base font-bold text-emerald-400">OPEN / EXTEND BRIDGE</h4>
                      <p className="text-xs text-emerald-400/80 mt-1">Deploy telescopic walkway to Platform 2. Interlock verifies train distance first.</p>
                    </button>

                    <button
                      onClick={() => setConfirmModal({ isOpen: true, cmd: 'CLOSE', text: 'Are you sure you want to manually retract the footbridge to Platform 1?' })}
                      className="p-5 rounded-xl border border-amber-600 bg-amber-950/40 hover:bg-amber-900/60 text-left transition"
                    >
                      <h4 className="text-base font-bold text-amber-400">CLOSE / RETRACT BRIDGE</h4>
                      <p className="text-xs text-amber-400/80 mt-1">Retract footbridge completely onto Platform 1 bay. Stops pedestrian crossing.</p>
                    </button>

                    <button
                      onClick={() => executeManualCmd('STOP')}
                      className="p-5 rounded-xl border border-slate-700 bg-slate-800 hover:bg-slate-750 text-left transition"
                    >
                      <h4 className="text-base font-bold text-slate-200">HOLD / PAUSE MOTION</h4>
                      <p className="text-xs text-slate-400 mt-1">Instantly pauses actuator at current position.</p>
                    </button>

                    <button
                      onClick={() => executeManualCmd('RESET_FAULT')}
                      className="p-5 rounded-xl border border-blue-700 bg-blue-950/40 hover:bg-blue-900/60 text-left transition"
                    >
                      <h4 className="text-base font-bold text-blue-400">RESET FAULT / OVERRIDE</h4>
                      <p className="text-xs text-blue-400/80 mt-1">Clear emergency latch after track inspection.</p>
                    </button>
                  </div>

                  {/* EMERGENCY STOP */}
                  <div className="bg-red-950/40 border-2 border-red-600 rounded-xl p-6 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                    <div>
                      <h3 className="text-base font-black text-red-400">EMERGENCY HARDWARE STOP</h3>
                      <p className="text-xs text-red-300/80 mt-1 max-w-md">Instantly cuts motor power and locks fail-safe solenoid brakes.</p>
                    </div>
                    <button
                      onClick={() => executeManualCmd('EMERGENCY_STOP')}
                      className="px-6 py-4 rounded-xl font-black text-sm uppercase bg-red-600 hover:bg-red-500 text-white shadow-2xl border-2 border-red-400 active:scale-95"
                    >
                      EMERGENCY STOP
                    </button>
                  </div>
                </div>
              )
            )}

            {/* TAB: EVENT LOGS */}
            {activeTab === 'logs' && (
              <div className="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-lg space-y-4">
                <div className="flex justify-between items-center pb-3 border-b border-slate-800">
                  <div>
                    <h2 className="text-base font-bold text-slate-100">Safety Event Audit Trail & History</h2>
                    <p className="text-xs text-slate-400">Sequential tamper-evident log of all transitions</p>
                  </div>
                  <button
                    onClick={() => alert('Audit log exported to CSV!')}
                    className="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs font-semibold"
                  >
                    Export CSV
                  </button>
                </div>

                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs">
                    <thead>
                      <tr className="border-b border-slate-800 text-slate-400 uppercase text-[10px] tracking-wider">
                        <th className="pb-2.5 pl-2">Time</th>
                        <th className="pb-2.5">Severity</th>
                        <th className="pb-2.5">Event</th>
                        <th className="pb-2.5">Train</th>
                        <th className="pb-2.5">Distance</th>
                        <th className="pb-2.5">State</th>
                        <th className="pb-2.5">Result</th>
                        <th className="pb-2.5 pr-2">Details</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800/60 font-sans">
                      {logs.map(l => (
                        <tr key={l.id} className="hover:bg-slate-800/40">
                          <td className="py-3 pl-2 font-mono text-slate-400">{l.time}</td>
                          <td className="py-3">
                            <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${
                              l.sev === 'CRITICAL' ? 'bg-red-950 text-red-300 border border-red-800' :
                              l.sev === 'WARNING' ? 'bg-amber-950 text-amber-300 border border-amber-800' :
                              'bg-slate-800 text-slate-300'
                            }`}>
                              {l.sev}
                            </span>
                          </td>
                          <td className="py-3 font-mono font-bold text-slate-200">{l.type}</td>
                          <td className="py-3 text-blue-400 font-mono">{l.train}</td>
                          <td className="py-3 font-mono text-slate-300">{l.dist}</td>
                          <td className="py-3 font-mono text-slate-400">{l.state}</td>
                          <td className="py-3 font-bold text-emerald-400">{l.res}</td>
                          <td className="py-3 text-slate-300 max-w-sm truncate">{l.details}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* TAB: SYSTEM HEALTH */}
            {activeTab === 'health' && (
              <div className="space-y-6">
                <div className="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-lg flex justify-between items-center">
                  <div>
                    <h2 className="text-base font-bold text-slate-100">System Hardware Diagnostics & Watchdog</h2>
                    <p className="text-xs text-slate-400">Continuous 1Hz health polling of all controllers and sensors</p>
                  </div>
                  <span className="px-3 py-1 rounded-lg text-xs font-bold uppercase bg-emerald-950 text-emerald-300 border border-emerald-800">
                    ALL SYSTEMS HEALTHY
                  </span>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                  {[
                    { name: 'CRIS Train Location API', status: freshness === 'LIVE' ? 'ONLINE' : 'OFFLINE', latency: '42 ms', tag: 'NTES GPS' },
                    { name: 'FastAPI Safety Engine', status: 'ONLINE', latency: '3 ms', tag: '10Hz Loop' },
                    { name: 'ESP32 IoT Bridge Controller', status: esp32Status, latency: '14 ms', tag: '192.168.1.145' },
                    { name: 'Linear Servo Actuators', status: esp32Status === 'ONLINE' ? 'ONLINE' : 'OFFLINE', latency: 'Current: 2.38A', tag: 'Dual Drive' },
                    { name: 'Dual Axle Counter Radars', status: 'ONLINE', latency: '8 ms', tag: 'Track 1 & 2' },
                    { name: 'Pedestrian Light Curtains', status: 'ONLINE', latency: '5 ms', tag: 'Infrared Barrier' },
                    { name: 'WebSocket Realtime Hub', status: 'ONLINE', latency: '1 ms', tag: 'Active' },
                    { name: 'SQLite Audit Store', status: 'ONLINE', latency: '2 ms', tag: 'Synchronized' }
                  ].map(c => (
                    <div key={c.name} className="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-lg">
                      <div className="flex justify-between items-center mb-2">
                        <span className="text-[10px] text-blue-400 font-mono">{c.tag}</span>
                        <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${c.status === 'ONLINE' ? 'bg-emerald-950 text-emerald-300' : 'bg-red-950 text-red-300 animate-pulse'}`}>
                          {c.status}
                        </span>
                      </div>
                      <h4 className="text-xs font-bold text-slate-100">{c.name}</h4>
                      <div className="text-[11px] text-slate-400 mt-2 font-mono">{c.latency}</div>
                    </div>
                  ))}
                </div>

                {/* API Key Connection Status Card */}
                <div className="bg-slate-900 border border-blue-800/80 rounded-xl p-6 shadow-xl space-y-3">
                  <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 border-b border-slate-800 pb-3">
                    <div className="flex items-center gap-2">
                      <span className="text-xl">🔑</span>
                      <div>
                        <h3 className="text-base font-bold text-slate-100">Live Train Location API Integration</h3>
                        <p className="text-xs text-slate-400">CRIS / NTES Telemetry Gateway Authentication</p>
                      </div>
                    </div>
                    <span className="px-3 py-1 rounded-full text-xs font-black uppercase tracking-wider bg-emerald-950 text-emerald-300 border border-emerald-700 flex items-center gap-1.5">
                      <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                      API KEY CONNECTED & ACTIVE
                    </span>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs pt-1">
                    <div className="p-3 rounded-lg bg-slate-800/80 border border-slate-700">
                      <span className="text-[10px] uppercase font-bold text-slate-400 block mb-1">Configured API Key</span>
                      <code className="font-mono font-bold text-blue-400 text-xs break-all select-all">
                        {API_KEY}
                      </code>
                    </div>
                    <div className="p-3 rounded-lg bg-slate-800/80 border border-slate-700">
                      <span className="text-[10px] uppercase font-bold text-slate-400 block mb-1">Authorization Method</span>
                      <span className="font-bold text-slate-200">Header: X-API-Key</span>
                      <span className="text-[10px] text-slate-400 block mt-0.5">TLS 1.3 Encrypted Handshake</span>
                    </div>
                    <div className="p-3 rounded-lg bg-slate-800/80 border border-slate-700">
                      <span className="text-[10px] uppercase font-bold text-slate-400 block mb-1">Endpoint Link</span>
                      <span className="font-mono text-emerald-400 font-bold">http://localhost:3000/</span>
                      <span className="text-[10px] text-slate-400 block mt-0.5">Proxy: http://localhost:8000/</span>
                    </div>
                  </div>
                </div>

                <div className="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl space-y-4">
                  <h3 className="text-base font-bold text-slate-100">Fail-Safe Behavioral Verification</h3>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <button
                      onClick={() => setEsp32Status(prev => prev === 'ONLINE' ? 'OFFLINE' : 'ONLINE')}
                      className="p-4 rounded-xl bg-slate-800 hover:bg-slate-700 text-left border border-slate-700 text-xs font-bold text-slate-200"
                    >
                      Toggle ESP32 Disconnect ({esp32Status === 'ONLINE' ? 'Simulate Failure' : 'Restore Link'})
                    </button>
                    <button
                      onClick={() => setFreshness(prev => prev === 'LIVE' ? 'UNAVAILABLE' : 'LIVE')}
                      className="p-4 rounded-xl bg-slate-800 hover:bg-slate-700 text-left border border-slate-700 text-xs font-bold text-slate-200"
                    >
                      Toggle Train API Failure ({freshness === 'LIVE' ? 'Simulate Stale/Offline' : 'Restore Feed'})
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* TAB: SIMULATION STUDIO */}
            {activeTab === 'simulation' && (
              <div className="space-y-6">
                <div className="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-lg flex justify-between items-center">
                  <div>
                    <h2 className="text-lg font-bold text-slate-100">Developer Simulation & Safety Studio</h2>
                    <p className="text-xs text-slate-400">Evaluate train approaches (10km ➔ 0km) and fail-safe safety triggers</p>
                  </div>
                  <button
                    onClick={() => {
                      setTrainDistance(4.2);
                      setIsSimPlaying(false);
                      setBridgeState('CLOSING');
                      setPositionPct(35);
                    }}
                    className="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 text-xs font-semibold"
                  >
                    Reset Baseline
                  </button>
                </div>

                <div className="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl space-y-5">
                  <div className="flex justify-between items-center pb-3 border-b border-slate-800">
                    <div>
                      <h3 className="text-sm font-bold text-slate-100">Train Approach Distance Slider</h3>
                      <p className="text-xs text-slate-400">Drag to test proximity thresholds</p>
                    </div>
                    <span className={`text-2xl font-black font-mono ${trainDistance <= 5 && trainDistance > 0 ? 'text-red-400' : 'text-blue-400'}`}>
                      {trainDistance.toFixed(1)} km
                    </span>
                  </div>

                  <input
                    type="range"
                    min="-1.5"
                    max="10.0"
                    step="0.1"
                    value={trainDistance}
                    onChange={(e) => {
                      const d = parseFloat(e.target.value);
                      setTrainDistance(d);
                      evaluateDistance(d);
                    }}
                    className="w-full h-3 bg-slate-800 rounded-lg cursor-pointer accent-blue-500"
                  />

                  <div className="flex justify-between text-[10px] text-slate-400 font-mono">
                    <span>10 km (Monitoring)</span>
                    <span className="text-amber-400 font-bold">5 km (Express Trigger)</span>
                    <span className="text-amber-400 font-bold">2 km (Local Trigger)</span>
                    <span className="text-red-400 font-bold">0 km (OGL Bridge)</span>
                    <span className="text-emerald-400 font-bold">+1.5 km (Passed Safe)</span>
                  </div>

                  <div className="flex justify-between items-center pt-3 border-t border-slate-800">
                    <button
                      onClick={() => setIsSimPlaying(!isSimPlaying)}
                      className={`px-4 py-2 rounded-lg text-xs font-bold text-white shadow ${
                        isSimPlaying ? 'bg-amber-600' : 'bg-emerald-600'
                      }`}
                    >
                      {isSimPlaying ? '⏸️ Pause Auto-Run' : '▶️ Run Continuous Approach (88 km/h)'}
                    </button>
                    <span className="text-xs text-slate-300 font-mono">
                      Current State: <strong className="text-white uppercase">{bridgeState}</strong>
                    </span>
                  </div>
                </div>

                {/* ESP32 Serial Console */}
                <div className="bg-slate-950 border border-slate-800 rounded-xl overflow-hidden shadow-2xl">
                  <div className="bg-slate-900 px-4 py-2 border-b border-slate-800 text-xs font-bold text-slate-200 font-mono">
                    ESP32 Serial Telemetry Console (/dev/ttyUSB0 • 115200 baud)
                  </div>
                  <div className="p-4 font-mono text-[11px] text-emerald-400 space-y-1 max-h-48 overflow-y-auto">
                    <div>[ESP32_INIT] Controller initialized. Free Heap: 184 KB. WiFi: -58 dBm.</div>
                    <div>[TELEMETRY] State: {bridgeState} | Pos: {positionPct}% | Motor: {motorStatus} | Limit LS1: {positionPct === 0 ? 'ON' : 'OFF'} | Limit LS2: {positionPct === 100 ? 'ON' : 'OFF'}</div>
                    {isDanger && (
                      <div className="text-amber-400 font-bold">[ACTUATOR] Proximity breach: Retracting bridge span to Platform 1 bay. Beacons active.</div>
                    )}
                    {bridgeState === 'CLOSED' && (
                      <div className="text-red-400 font-bold">[INTERLOCK] LS1 engaged. Solenoid brake energized. Track safe.</div>
                    )}
                    {bridgeState === 'SAFE_OPEN' && (
                      <div className="text-emerald-400 font-bold">[INTERLOCK] LS2 engaged. Bridge fully deployed. Green crossing lights ON.</div>
                    )}
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* MOBILE BOTTOM NAVIGATION */}
          <div className="md:hidden fixed bottom-0 left-0 right-0 z-40 bg-slate-900/95 backdrop-blur border-t border-slate-800 px-2 py-1.5 flex justify-around items-center">
            {[
              { id: 'dashboard', label: 'Dash', icon: '📊' },
              { id: 'search', label: 'Search', icon: '🔍' },
              { id: 'details', label: 'Track', icon: '🚆' },
              { id: 'control', label: 'Control', icon: '🎛️' },
              { id: 'logs', label: 'Logs', icon: '📜' },
              { id: 'simulation', label: 'Sim', icon: '🕹️' }
            ].map(tab => (
              <button
                key={tab.id}
                onClick={() => setActiveTab(tab.id)}
                className={`flex flex-col items-center py-1 px-2 rounded-lg text-[10px] ${
                  activeTab === tab.id ? 'text-blue-400 font-bold' : 'text-slate-400'
                }`}
              >
                <span className="text-base">{tab.icon}</span>
                <span>{tab.label}</span>
              </button>
            ))}
          </div>

          {/* CONFIRMATION MODAL */}
          {confirmModal.isOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
                <h3 className="text-base font-bold text-slate-100">Confirm Bridge Command</h3>
                <p className="text-xs text-slate-300">{confirmModal.text}</p>
                <div className="flex justify-end gap-3 pt-2">
                  <button
                    onClick={() => setConfirmModal({ isOpen: false, cmd: null, text: '' })}
                    className="px-4 py-2 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300"
                  >
                    Cancel
                  </button>
                  <button
                    onClick={() => executeManualCmd(confirmModal.cmd)}
                    className="px-4 py-2 rounded-lg text-xs font-bold bg-blue-600 hover:bg-blue-500 text-white shadow"
                  >
                    Confirm & Execute
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* DISCLAIMER MODAL */}
          {isDisclaimerOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md p-4">
              <div className="bg-slate-900 border-2 border-amber-500 rounded-2xl max-w-2xl w-full p-6 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-start border-b border-slate-800 pb-3">
                  <div>
                    <h2 className="text-lg font-bold text-white">Academic Prototype & Safety Notice</h2>
                    <p className="text-xs text-amber-400 font-semibold">RAILSAFE Footbridge System Specification</p>
                  </div>
                  <button onClick={() => setIsDisclaimerOpen(false)} className="text-slate-400 hover:text-white text-xl">✕</button>
                </div>

                <div className="space-y-3 text-xs text-slate-300 leading-relaxed">
                  <p className="p-3 bg-amber-950/40 border border-amber-800 rounded-xl text-amber-200 font-semibold">
                    This is an academic engineering prototype demonstration for Ongole Railway Station footbridge automation.
                  </p>
                  <p>
                    <strong>SIL-4 / CENELEC Certification:</strong> Operational deployment requires fail-safe electronic interlocking certified by RDSO / Commissioner of Railway Safety (CRS).
                  </p>
                  <p>
                    <strong>Hardware Redundancy:</strong> Real-world implementations require independent dual axle counters, optical doppler trackside radars, mechanical deadbolts, and fail-safe spring returns.
                  </p>
                  <p>
                    <strong>Fail-Safe Invariant:</strong> Safety decisions are never made exclusively by frontend code. The backend safety engine and physical limit switches enforce final command veto.
                  </p>
                </div>

                <div className="pt-3 border-t border-slate-800 flex justify-end">
                  <button
                    onClick={() => setIsDisclaimerOpen(false)}
                    className="px-5 py-2.5 rounded-lg text-xs font-bold bg-blue-600 text-white shadow"
                  >
                    I Understand & Acknowledge
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
